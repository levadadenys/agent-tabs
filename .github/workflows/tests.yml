name: Tests

# The macOS suite, split from ci.yml so it can skip changes that cannot affect
# it. Lint and the gitleaks scan stay in ci.yml and run on every change: a leak
# can be in a doc as easily as in code.
on:
  push:
    branches: [main]
    paths:
      - "agent_tabs/**"
      - "bin/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "agent_tabs/**"
      - "bin/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    # macOS, not Linux: the tool is macOS-only and the suite drives the real
    # lsof, ps, sysctl and osascript it depends on.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes bill at ten times the Linux rate on a private
        # repository and are free on a public one. While private, test only
        # the bounds: 3.9 (macOS's /usr/bin/python3) and the newest. Public, the
        # full range runs with no change here.
        python: ${{ github.event.repository.private && fromJSON('["3.9", "3.14"]') || fromJSON('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/run_all.py
