# Secret scanning config for gitleaks (https://gitleaks.io).
#
# The default rules cover credentials. These two add what matters for a repo
# that is intended to become public: machine-specific paths and personal email
# addresses, neither of which the defaults look for.
[extend]
useDefault = true

[[rules]]
id = "personal-home-path"
description = "Home directory path — examples must use /Users/you"
regex = '''/Users/[A-Za-z0-9._-]+'''
  [rules.allowlist]
  # RE2 has no lookahead, so the placeholder is allowed here rather than
  # excluded in the pattern.
  regexTarget = "match"
  # Both are documented placeholders. /Users/me appears in earlier history and
  # is not a real path; allowlisting it keeps old commits from tripping a scan
  # of a new branch forever.
  #
  # Because the rule matches only the /Users/<name> prefix, allowlisting these
  # also exempts their subtrees -- /Users/you/credentials.txt is suppressed.
  # That is deliberate, not an oversight: the examples this allowlist exists
  # for are subtree paths (/Users/you/.codex-work in config.example.json), and
  # nothing distinguishes an example from a leak under the same prefix. The
  # residual risk is an account literally named "me" or "you". A real username
  # is still caught -- verified.
  regexes = ['''^/Users/you$''', '''^/Users/me$''']

[[rules]]
id = "personal-email"
description = "Personal email at a consumer provider"
regex = '''[A-Za-z0-9._%+-]+@(gmail|googlemail|icloud|yahoo|hotmail|outlook)\.[A-Za-z]{2,}'''
